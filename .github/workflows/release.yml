name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. 1.0.0)'
        required: true

permissions:
  contents: read

concurrency:
  group: wordpress-release-${{ github.ref }}
  cancel-in-progress: false

env:
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch' }}
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate release tag
        if: env.IS_RELEASE == 'true'
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'

      - name: Checkout plugin
        uses: actions/checkout@v7
        with:
          ref: ${{ env.IS_RELEASE == 'true' && env.RELEASE_TAG || '' }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, json
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Validate plugin versions
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const main = fs.readFileSync('bicho-wordpress.php', 'utf8');
          const readme = fs.readFileSync('readme.txt', 'utf8');
          const version = process.env.IS_RELEASE === 'true' ? process.env.RELEASE_TAG.slice(1) : pkg.version;
          assert.equal(pkg.version, version);
          assert.equal(main.match(/\* Version: (\S+)/)[1], version);
          assert.equal(main.match(/define\('BICHO_WORDPRESS_VERSION', '([^']+)'\)/)[1], version);
          assert.equal(readme.match(/^Stable tag: (\S+)/m)[1], version);
          NODE

      - name: Install dependencies
        run: |
          npm ci
          composer install --no-interaction --no-progress --prefer-dist

      - name: Build, test, and package
        run: |
          npm run build
          npm test
          npm run package

      - name: Upload plugin ZIP artifact
        uses: actions/upload-artifact@v7
        with:
          name: bicho-error-tracking
          path: build/bicho-error-tracking.zip
          if-no-files-found: error

      - name: Attach ZIP to GitHub release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" build/bicho-error-tracking.zip --clobber
          else
            gh release create "$RELEASE_TAG" build/bicho-error-tracking.zip --title "Bicho for WordPress $RELEASE_TAG" --generate-notes
          fi
